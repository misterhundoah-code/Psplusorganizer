name: IGDB lookup

# Looks games up on IGDB for portrait covers and trailer videos (tools/fetch_igdb.py).
# Weekly, and by hand: "all" updates data/igdb.json with games not looked up yet; "sample" or ids only print.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "all (update data/igdb.json), misses (retry games not found), refresh (every game again) or sample (print only)"
        required: false
        default: "all"
        type: string
      sample:
        description: "How many games to sample"
        required: false
        default: "24"
        type: string
      ids:
        description: "Or particular wall ids, separated by commas"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: igdb
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          MODE: ${{ inputs.mode || 'all' }}
          SAMPLE: ${{ inputs.sample }}
          IDS: ${{ inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then python tools/fetch_igdb.py --ids "$IDS"
          elif [ "$MODE" = "sample" ]; then python tools/fetch_igdb.py --sample "${SAMPLE:-24}"
          elif [ "$MODE" = "refresh" ]; then python tools/fetch_igdb.py --all --refresh
          elif [ "$MODE" = "misses" ]; then python tools/fetch_igdb.py --all --misses
          else python tools/fetch_igdb.py --all; fi
      - name: Covers and videos for the wall
        if: ${{ !inputs.ids && inputs.mode != 'sample' }}
        run: |
          pip install -q pillow
          python tools/igdb_extras.py
      - name: Save data/igdb.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/igdb.json data/videos.json data/box.json box 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update IGDB covers and trailers"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
