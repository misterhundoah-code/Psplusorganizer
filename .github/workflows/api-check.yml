name: Check the account API

# Runs a live check of the community-score routes with a throwaway account (deleted at the end).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node worker/test/votes.smoke.mjs
        env:
          API: https://psplus-sorter-api.misterhundo-ah.workers.dev
          ORIGIN: https://misterhundoah-code.github.io
