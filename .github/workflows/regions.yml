name: Fetch regional catalogues

# Downloads Sony's Game Catalogue and Classics lists for every store region the
# site offers and saves which games each region gets in data/regions.json.
# Runs weekly, whenever the game data changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 10 * * 1,4"
  push:
    branches: [main]
    paths: ["data/games.json", "data/catalogue.json", "tools/fetch_regions.py"]

permissions:
  contents: write
  pages: write

concurrency:
  group: regions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python tools/fetch_regions.py
      - name: Commit any changes
        id: commit
        run: |
          git add data/regions.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update regional catalogues"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on the next push."
