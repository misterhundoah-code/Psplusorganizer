name: Fetch store deals (prototype)

# Prototype: collects PlayStation Store deals for one region and saves data/deals.json and
# data/deals-log.txt to the deals-preview branch (not main), so nothing on the site changes.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Store region, e.g. en-ca"
        default: "en-ca"
  push:
    branches: [main]
    paths: ["tools/fetch_deals.py", ".github/workflows/deals.yml"]

permissions:
  contents: write

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u tools/fetch_deals.py "${{ inputs.region || 'en-ca' }}"
      - name: Save to the deals-preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/deals.json data/deals-log.txt /tmp/
          git fetch origin deals-preview || true
          git checkout -B deals-preview
          cp /tmp/deals.json /tmp/deals-log.txt data/
          git add -f data/deals.json data/deals-log.txt
          git commit -m "Store deals preview" || exit 0
          git push -f origin deals-preview
