name: Fetch pages (debug)

# Maintenance helper: prints the raw wikitext of the listed wiki pages to the
# job log, for building data files. Run by hand only; it changes nothing.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Fandom page titles, separated by ;"
        required: false
        default: ""
        type: string
      urls:
        description: "Other URLs to print (raw), separated by ;"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          PAGES: ${{ inputs.pages }}
          URLS: ${{ inputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for url in [u.strip() for u in os.environ.get("URLS", "").split(";") if u.strip()]:
              try:
                  body = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=60).read().decode("utf-8", "replace")
              except Exception as e:
                  body = f"ERROR {e}"
              print(f"=====URL {url} ({len(body)} chars)=====")
              for i in range(0, len(body), 2000):
                  print("RAW|" + body[i:i+2000].replace("\n", " "))
              print(f"=====END {url}=====")
          for title in [p.strip() for p in os.environ.get("PAGES", "").split(";") if p.strip()]:
              url = "https://playstation.fandom.com/api.php?" + urllib.parse.urlencode(
                  {"action": "parse", "page": title, "prop": "wikitext", "format": "json", "formatversion": "2"})
              req = urllib.request.Request(url, headers={"User-Agent": "psplus-sorter data build (github.com/misterhundoah-code/Psplusorganizer)"})
              try:
                  data = json.load(urllib.request.urlopen(req, timeout=60))
                  text = data.get("parse", {}).get("wikitext", "") or json.dumps(data)[:500]
              except Exception as e:
                  text = f"ERROR {e}"
              print(f"=====PAGE {title}=====")
              for line in text.splitlines():
                  print("WT|" + line)
              print(f"=====END {title}=====")
          PY
