name: Fetch artwork

# Downloads artwork for any game that doesn't have it yet, saves it in art/,
# and commits it. Runs weekly, whenever the game data changes, or by hand
# from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Download every image again"
        type: boolean
        default: false
      probe:
        description: "Debug only: show what a store search returns for this title"
        type: string
        default: ""
  schedule:
    - cron: "23 9 * * 1"
  push:
    branches: [main, listicles]
    paths: ["data/games.json", "data/catalogue.json", "data/writeups.json", "tools/fetch_wide_art.py"]

permissions:
  contents: write
  pages: write

concurrency:
  group: artwork
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - if: inputs.probe != ''
        run: python tools/fetch_art.py --probe "$PROBE"
        env:
          PROBE: ${{ inputs.probe }}
      - if: inputs.probe == ''
        run: python tools/fetch_art.py ${{ inputs.refresh && '--refresh' || '' }}
      - if: inputs.probe == ''
        run: mkdir -p art/wide && python -u tools/fetch_wide_art.py ${{ inputs.refresh && '--force' || '' }} | tee art/wide/fetch-log.txt
      - name: Commit any new artwork
        if: inputs.probe == ''
        id: commit
        run: |
          git add art data/art.json data/links.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new artwork."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update artwork"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on the next push."
