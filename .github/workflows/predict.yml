name: Update PS Plus predictions

# Which games are likely to join PS Plus next (lists/coming-to-ps-plus). Weekly, on Thursdays, so each
# Wednesday announcement is in: refetches Wikipedia's and Wikidata's PS4/PS5 games and the PlayStation
# Blog, retrains the model (tools/predict/model.py) and commits data/predict-page.json. The page itself
# is rebuilt by the Build list pages workflow when this finishes.
on:
  workflow_dispatch:
    inputs:
      experiments:
        description: "Backtest only: versions of the model to compare, separated by ; (e.g. base;series;season). Commits nothing."
        type: string
        default: ""
  schedule:
    - cron: "17 15 * * 4"
  push:
    branches: [main]
    paths: ["tools/predict/**", ".github/workflows/predict.yml"]

permissions:
  contents: write

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow mwparserfromhell numpy scikit-learn
      - run: python -u tools/predict/fetch_raw.py
      - run: python -u tools/predict/history.py
      - if: ${{ !inputs.experiments }}
        run: python -u tools/predict/model.py
      - if: ${{ inputs.experiments }}
        env:
          EXPERIMENTS: ${{ inputs.experiments }}
        run: |
          IFS=';' read -ra VS <<< "$EXPERIMENTS"
          for v in "${VS[@]}"; do
            v="$(echo "$v" | xargs)"; [ "$v" = "base" ] && x="" || x="$v"
            echo "=================== EXPERIMENT ${v} ==================="
            PREDICT_EXTRA="$x" python -u tools/predict/model.py data/predict-raw/wikidata.json lr --eval > out.txt 2>&1 || echo "(exited with $?)"
            grep -E "held-out|^ +20[0-9]{2}-|weights|Error|Traceback|line [0-9]+" out.txt || tail -n 30 out.txt
          done
      - name: Commit any changes
        if: ${{ !inputs.experiments }}
        run: |
          git add data/predict-page.json data/predict-history.json data/predict-snapshot.json
          if git diff --cached --quiet; then echo "No changes."; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update PS Plus predictions"
            git pull --rebase
            git push
          fi
