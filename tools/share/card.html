<!DOCTYPE html>
<!-- Source for og.png (the link preview image). Render with: python3 tools/share/render.py -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#1E3A9E;font-family:"Archivo",sans-serif;position:relative}
/* store sign */
.sign{position:absolute;left:0;right:0;top:0;height:250px;background:#FFC925;
  border-bottom:12px solid #0E1636;padding:38px 64px 0}
.sign h1{font-family:"Bungee";color:#1E3A9E;font-size:104px;line-height:.92;letter-spacing:-1px;
  text-shadow:6px 6px 0 #0E1636}
.sign h1 span{display:block;font-size:56px;color:#0E1636;text-shadow:none;letter-spacing:2px;margin-bottom:6px}
/* the open sticker */
.open{position:absolute;right:62px;top:46px;width:190px;height:190px;border-radius:50%;background:#E23D28;
  color:#fff;transform:rotate(9deg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:"Permanent Marker";text-align:center;box-shadow:5px 5px 0 #0E1636;border:5px solid #fff}
.open b{font-size:62px;line-height:.9;font-weight:400}
.open small{font-size:25px;line-height:1.05;margin-top:6px}
/* shelf of cases */
.shelf{position:absolute;left:64px;right:64px;top:300px;height:196px;display:flex;gap:18px;align-items:flex-end}
.case{flex:1;height:196px;background:#fff;border:4px solid #0E1636;position:relative;display:flex;flex-direction:column}
.case i{display:block;height:44px;border-bottom:4px solid #0E1636}
.case em{font-style:normal;font-family:"Bungee";font-size:17px;color:#0E1636;padding:10px 10px 0;line-height:1.1}
.case u{text-decoration:none;display:block;margin:10px 10px 0;height:9px;background:#C9CFDD}
.case u+u{width:55%}
.tag{position:absolute;right:-14px;bottom:-16px;width:66px;height:66px;border-radius:50%;
  font-family:"Bungee";font-size:26px;display:flex;align-items:center;justify-content:center;
  border:4px solid #0E1636;transform:rotate(-8deg);color:#0E1636}
.lip{position:absolute;left:40px;right:40px;top:496px;height:22px;background:#0E1636}
.foot{position:absolute;left:64px;right:64px;bottom:34px;display:flex;justify-content:space-between;align-items:baseline;color:#fff}
.foot p{white-space:nowrap;font-size:32px;font-weight:700;font-stretch:112%}
.foot a{font-family:"Bungee";font-size:34px;color:#FFC925;text-decoration:none}
</style></head><body>
<div class="sign">
  <h1><span>PS PLUS</span>RENTAL WALL</h1>
</div>
<div class="open"><b>Free</b><small>sort the<br>catalogue</small></div>
<div class="shelf">
  <div class="case"><i style="background:#E23D28"></i><em>ACTION</em><u></u><u></u><div class="tag" style="background:#FFC925">94</div></div>
  <div class="case"><i style="background:#0D7C86"></i><em>CLASSICS</em><u></u><u></u></div>
  <div class="case"><i style="background:#6A3FD0"></i><em>RPG</em><u></u><u></u><div class="tag" style="background:#FFE08A">88</div></div>
  <div class="case"><i style="background:#1F8A4C"></i><em>CO-OP</em><u></u><u></u></div>
  <div class="case"><i style="background:#D9690B"></i><em>HORROR</em><u></u><u></u><div class="tag" style="background:#FFA552">79</div></div>
  <div class="case"><i style="background:#1E3A9E"></i><em>INDIE</em><u></u><u></u></div>
</div>
<div class="lip"></div>
<div class="foot"><p>Sort every game by score and length</p><a>wallofpsplus.com</a></div>
</body></html>
